<script src="https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js"></script>
<script>
(() => {
  const NP = window.NepaliDate;
  if (!NP) return;

  class RachnaDateConverter {
    constructor(value) { this.value = value; }
    toAd() {
      const match = String(this.value ?? '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!match) throw new Error('Invalid BS date');
      const year = Number(match[1]);
      const month = Number(match[2]);
      const date = Number(match[3]);
      if (month < 1 || month > 12 || date < 1 || date > 32) throw new Error('Invalid BS date');
      const d = new NP(`${year}-${String(month).padStart(2,'0')}-${String(date).padStart(2,'0')}`);
      const bs = d.getBS();
      if (bs.year !== year || bs.month !== month || bs.date !== date) throw new Error('Invalid BS date');
      const ad = d.getAD();
      return { year: ad.year, month: ad.month, date: ad.date };
    }
    toBs() {
      const match = String(this.value ?? '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!match) throw new Error('Invalid AD date');
      const year = Number(match[1]);
      const month = Number(match[2]);
      const date = Number(match[3]);
      if (month < 1 || month > 12 || date < 1 || date > 31) throw new Error('Invalid AD date');
      const d = NP.fromAD ? NP.fromAD(new Date(Date.UTC(year, month - 1, date))) : new NP(new Date(Date.UTC(year, month - 1, date)));
      const bs = d.getBS();
      return { year: bs.year, month: bs.month, date: bs.date };
    }
  }
  window.DateConverter = RachnaDateConverter;
})();
</script>
<script>
(() => {
  const nativeAdd = document.addEventListener.bind(document);
  document.addEventListener = (type, listener, options) => {
    if (type === 'DOMContentLoaded' && typeof listener === 'function') {
      const gated = async (event) => {
        try { if (window.RachnaAPI?.init) await window.RachnaAPI.init(); } catch (_) {}
        return listener(event);
      };
      return nativeAdd(type, gated, options);
    }
    return nativeAdd(type, listener, options);
  };
})();
</script>
<script src="app.js?v=20260905.12"></script>
<script>
(() => {
  const NP = window.NepaliDate;
  if (!NP) return;

  const fillDays = (box) => {
    const year = box.querySelector('[data-bs-year]');
    const month = box.querySelector('[data-bs-month]');
    const day = box.querySelector('[data-bs-day]');
    const hidden = box.querySelector('[data-bs-value]');
    if (!year || !month || !day || !hidden) return;
    const y = Number(year.value);
    const m = Number(month.value);
    if (!y || !m) return;

    const current = Number(day.value) || 0;
    const valid = [];
    for (let d = 1; d <= 32; d++) {
      try {
        const np = new NP(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
        const bs = np.getBS();
        if (bs.year === y && bs.month === m && bs.date === d) valid.push(d);
      } catch (_) {}
    }

    const expected = '<option value="">Day</option>' + valid.map(d => `<option value="${d}"${d === current ? ' selected' : ''}>${d}</option>`).join('');
    if (day.innerHTML !== expected) day.innerHTML = expected;

    const selected = Number(day.value);
    hidden.value = selected && valid.includes(selected)
      ? `${y}-${String(m).padStart(2,'0')}-${String(selected).padStart(2,'0')}`
      : '';
  };

  const repair = (root = document) => root.querySelectorAll('.bs-picker').forEach(box => fillDays(box));
  const bootRepair = () => {
    repair(document);
    document.addEventListener('change', e => {
      if (e.target.matches('[data-bs-year],[data-bs-month],[data-bs-day]')) {
        const box = e.target.closest('.bs-picker');
        if (box) fillDays(box);
      }
    }, true);
    const observer = new MutationObserver(mutations => {
      for (const mutation of mutations) {
        if (mutation.type !== 'childList') continue;
        for (const node of mutation.addedNodes) {
          if (node.nodeType !== 1) continue;
          if (node.matches?.('.bs-picker')) fillDays(node);
          node.querySelectorAll?.('.bs-picker').forEach(fillDays);
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootRepair, { once: true });
  else bootRepair();
})();
</script>
<script>
window.addEventListener('load',()=>{if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js?v=20260905.12').catch(()=>{});});
