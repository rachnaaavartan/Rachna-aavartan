name: Final one-time OS cleanup

on:
  push:
    paths:
      - '.github/workflows/final-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore canonical runtime and remove all repair layers
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 21a5409c50d6ae3a2cf83c7ad3482241bc5dcd3d
          git show 21a5409c50d6ae3a2cf83c7ad3482241bc5dcd3d:app.js > app.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js').read_text()
          marker = "\n'use strict';\n{\n  'use strict';\n\n  const SUPABASE_URL ="
          ui_marker = "\n}\n'use strict';\nconst A=window.RachnaAPI;"
          first = app.find(marker)
          if first < 0: raise SystemExit('First backend block not found')
          second = app.find(marker, first + len(marker))
          if second < 0: raise SystemExit('Second backend block not found')
          ui = app.find(ui_marker, second)
          if ui < 0: raise SystemExit('UI block boundary not found')
          app = app[:second] + app[ui:]

          header = "const A=window.RachnaAPI;\nconst DC=window.DateConverter;\n"
          replacement = "const A=window.RachnaAPI;\nconst NP=window.NepaliDate;\n"
          if header not in app: raise SystemExit('Old UI dependency header not found')
          app = app.replace(header, replacement, 1)

          date_block = re.search(r"const todayAD=.*?(?=const picker=)", app, re.S)
          if not date_block: raise SystemExit('Date helper block not found')
          new_date = r'''const todayAD=()=>{const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kathmandu',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o={};f.forEach(x=>{if(x.type!=='literal')o[x.type]=x.value});return `${o.year}-${o.month}-${o.day}`};
          const fmt2=n=>String(n).padStart(2,'0');
          const fmtBs=o=>o?`${o.year}-${fmt2(o.month)}-${fmt2(o.date)}`:'';
          const parts=v=>{const m=String(v||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?{year:+m[1],month:+m[2],date:+m[3]}:null};
          const adOfBs=bs=>{try{const p=parts(bs);if(!p)throw new Error('Invalid BS date');const d=new NP(p.year,p.month-1,p.date);if(d.getYear()!==p.year||d.getMonth()!==p.month-1||d.getDate()!==p.date)throw new Error('Invalid BS date');const ad=d.getAD();return `${ad.year}-${fmt2(ad.month)}-${fmt2(ad.date)}`}catch(_){return''}};
          const bsOfAd=ad=>{try{const p=parts(String(ad||'').slice(0,10));if(!p)throw new Error('Invalid AD date');const js=new Date(Date.UTC(p.year,p.month-1,p.date));const d=NP.fromAD?NP.fromAD(js):new NP(js);const bs=d.getBS();return fmtBs(bs)}catch(_){return''}};
          const todayBS=()=>bsOfAd(todayAD());
          const validDays=(y,m)=>{const out=[];for(let d=1;d<=32;d++){try{const x=new NP(y,m-1,d);if(x.getYear()===y&&x.getMonth()===m-1&&x.getDate()===d)out.push(d)}catch(_){}}return out};
          '''
          app = app[:date_block.start()] + new_date + app[date_block.end():]

          old_bind = re.search(r"const bindPickers=.*?(?=const modal=)", app, re.S)
          if not old_bind: raise SystemExit('Picker binder not found')
          new_bind = r'''const bindPickers=root=>{$$('.bs-picker',root).forEach(box=>{const y=$('[data-bs-year]',box),m=$('[data-bs-month]',box),d=$('[data-bs-day]',box),hidden=$('[data-bs-value]',box);const sync=()=>{const yy=+y.value,mm=+m.value;if(!yy||!mm){hidden.value='';return}const days=validDays(yy,mm);const current=+d.value;const keep=days.includes(current)?current:0;d.innerHTML='<option value="">Day</option>'+days.map(v=>`<option value="${v}"${v===keep?' selected':''}>${v}</option>`).join('');d.value=keep?String(keep):'';hidden.value=keep?`${yy}-${String(mm).padStart(2,'0')}-${String(keep).padStart(2,'0')}`:''};[y,m].forEach(x=>x.addEventListener('change',sync));d.addEventListener('change',()=>{const yy=+y.value,mm=+m.value,dd=+d.value;if(yy&&mm&&dd&&validDays(yy,mm).includes(dd))hidden.value=`${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;else hidden.value=''});sync()})};
          '''
          app = app[:old_bind.start()] + new_bind + app[old_bind.end():]
          Path('app.js').write_text(app)

          index = '''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="theme-color" content="#25232a">
          <meta name="description" content="Rachna + Aavartan Event Business Suite">
          <title>Rachna OS — Business Suite</title>
          <link rel="manifest" href="manifest.webmanifest?v=20260905.16">
          <link rel="stylesheet" href="styles.css?v=20260905.16">
          </head>
          <body>
          <div class="app">
            <aside class="sidebar">
              <div class="brand"><div class="brand-mark">R</div><div><div class="brand-title">RACHNA</div><div class="brand-sub">CELEBRATIONS, COMPOSED</div></div></div>
              <div class="workspace"><b>Rachna + Aavartan</b><span>Event Business Suite · Nepal</span></div>
              <nav class="nav" id="nav"></nav>
              <div class="user"><div class="avatar">R</div><div><b id="userName">Offline</b><small id="userRole">Sign in</small></div></div>
            </aside>
            <main class="main">
              <header class="topbar">
                <div class="crumb" id="crumb">Home</div>
                <button type="button" class="top-action" data-action="date-check">◫ Date Check</button>
                <button type="button" class="top-action primary" data-route="inquiries">✉ Enquiries</button>
                <button type="button" class="top-action" data-action="quick-action">⚡ Quick action</button>
                <div class="top-actions"><div class="pill">NPR · Nepal</div><button type="button" class="icon" id="refresh" data-action="refresh" title="Refresh">↻</button><button type="button" class="icon" id="authBtn" data-action="account" title="Account">R</button></div>
              </header>
              <section class="page" id="page"></section>
            </main>
          </div>
          <div class="toast" id="toast"></div>
          <div class="modal-backdrop" id="backdrop"><div class="modal" id="modal"></div></div>
          <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js"></script>
          <script src="app.js?v=20260905.16"></script>
          <script>window.addEventListener('load',()=>{if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js?v=20260905.16').catch(()=>{});});</script>
          </body>
          </html>
          '''
          Path('index.html').write_text(index)

          sw = '''const CACHE='rachna-os-v20260905-16';
          const CORE=['./','./index.html?v=20260905.16','./styles.css?v=20260905.16','./app.js?v=20260905.16','./manifest.webmanifest?v=20260905.16'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const u=new URL(e.request.url);if(u.origin!==self.location.origin)return;e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{const x=r.clone();caches.open(CACHE).then(k=>k.put(e.request,x)).catch(()=>{});return r})).catch(()=>caches.match('./index.html?v=20260905.16')))});
          '''
          Path('sw.js').write_text(sw)
          PY

      - name: Replace Pages workflow with canonical validator
        run: |
          cat > .github/workflows/pages.yml <<'YAML'
          name: Deploy Rachna OS
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: true
          jobs:
            deploy:
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - uses: actions/checkout@v4
                - name: Validate production runtime
                  run: |
                    set -e
                    node --check app.js
                    node --check sw.js
                    test -f index.html
                    test -f styles.css
                    test -f sw.js
                    test -f manifest.webmanifest
                    test -f supabase/schema.sql
                    test "$(grep -Fc 'const SUPABASE_URL =' app.js)" -eq 1
                    grep -Fq 'window.RachnaAPI' app.js
                    grep -Fq 'const NP=window.NepaliDate;' app.js
                    grep -Fq 'const validDays=' app.js
                    grep -Fq 'new NP(y,m-1,d)' app.js
                    grep -Fq 'data-bs-year' app.js
                    grep -Fq 'data-bs-month' app.js
                    grep -Fq 'data-bs-day' app.js
                    ! grep -Fq 'DateConverter' index.html
                    ! grep -Fq 'nativeAdd' index.html
                    ! grep -Fq 'type="date"' app.js index.html
                    ! grep -Fq 'backend-clean.js' app.js index.html sw.js
                    ! grep -Fq 'ui.css' app.js index.html sw.js
                    ! grep -Fq 'bs-fix.js' app.js index.html sw.js
                    ! grep -Fq 'repair-unified-runtime' app.js index.html sw.js
                    test ! -e .github/workflows/repair-runtime.yml
                    node <<'NODE'
                    const fs=require('fs');
                    const app=fs.readFileSync('app.js','utf8');
                    const html=fs.readFileSync('index.html','utf8');
                    const m=app.match(/const HANDLERS=\{([\s\S]*?)\n\};/);
                    const r=app.match(/const ROUTES=\{([\s\S]*?)\};/);
                    if(!m||!r) throw new Error('Handler or route registry missing');
                    const actions=[...app.matchAll(/data-action=["']([^"']+)["']/g)].map(x=>x[1]).filter(x=>!x.includes('$'));
                    const handlers=new Set([...m[1].matchAll(/(?:^|,)\s*['"]?([A-Za-z0-9_-]+)['"]?\s*:/g)].map(x=>x[1]));
                    if(app.includes("HANDLERS['sign-in-panel']")) handlers.add('sign-in-panel');
                    const missing=[...new Set(actions)].filter(x=>!handlers.has(x));
                    if(missing.length) throw new Error('Unwired actions: '+missing.join(', '));
                    const routes=[...app.matchAll(/data-route=["']([^"']+)["']/g)].map(x=>x[1]).filter(x=>!x.includes('$'));
                    const routeKeys=new Set([...r[1].matchAll(/(?:^|,)\s*['"]?([A-Za-z0-9_-]+)['"]?\s*:/g)].map(x=>x[1]));
                    const bad=[...new Set(routes)].filter(x=>!routeKeys.has(x));
                    if(bad.length) throw new Error('Unwired routes: '+bad.join(', '));
                    if((app.match(/const SUPABASE_URL =/g)||[]).length!==1) throw new Error('Duplicate backend runtime');
                    if((app.match(/const state = \{/g)||[]).length!==1) throw new Error('Duplicate state runtime');
                    if(html.includes('DateConverter')||html.includes('nativeAdd')) throw new Error('Extra calendar layer remains');
                    console.log(`Verified ${new Set(actions).size} actions and ${new Set(routes).size} routes with one backend runtime.`);
                    NODE
                    curl -fsSL -o /dev/null https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: .
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

      - name: Verify and commit cleaned OS
        run: |
          set -e
          node --check app.js
          node --check sw.js
          test "$(grep -Fc 'const SUPABASE_URL =' app.js)" -eq 1
          test "$(grep -Fc 'const state = {' app.js)" -eq 1
          test ! -e .github/workflows/repair-runtime.yml
          rm -f .github/workflows/final-cleanup.yml
          git add app.js index.html sw.js .github/workflows/pages.yml .github/workflows/final-cleanup.yml
          git config user.name 'rachnaaavartan'
          git config user.email 'rachna.aavartan@gmail.com'
          git commit -m 'Restore single backend runtime and fix BS picker'
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
