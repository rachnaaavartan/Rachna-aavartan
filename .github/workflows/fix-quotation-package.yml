name: Repair quotation version deletion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[quote-version-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quotation version deletion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()

          anchor="""  async function deleteQuoteItem(id) {
    if (!id) throw new Error('Quotation item ID is required');
    const item = state.quotationItems.find(x => x.id === id);
    await q(sb.from('quotation_items').delete().eq('id', id));
    if (item?.quotation_id) {
      const qrow = state.quotations.find(q => q.id === item.quotation_id);
      if (qrow) await recalc(qrow.project_id);
    } else await refresh();
    return true;
  }
"""
          if anchor not in s: raise SystemExit('deleteQuoteItem anchor missing')
          if 'async function deleteQuotation' not in s:
              s=s.replace(anchor,anchor+"""
  async function deleteQuotation(id) {
    if (!id) throw new Error('Quotation ID is required');
    const qrow = state.quotations.find(q => q.id === id);
    if (!qrow) throw new Error('Quotation version not found');
    await q(sb.from('quotation_items').delete().eq('quotation_id', id));
    await q(sb.from('quotations').delete().eq('id', id));
    if (qrow.project_id) await recalc(qrow.project_id); else await refresh();
    return true;
  }
""",1)

          api="    createQuotation, updateQuotation, addQuoteItem, deleteQuoteItem, createQuoteVersionFrom, recalc,"
          if api in s:
              s=s.replace(api,"    createQuotation, updateQuotation, addQuoteItem, deleteQuoteItem, deleteQuotation, createQuoteVersionFrom, recalc,",1)
          elif 'deleteQuotation, createQuoteVersionFrom' not in s:
              raise SystemExit('quotation API export anchor missing')

          button="""<button type=\"button\" class=\"btn tiny\" data-action=\"add-quote-item\" data-id=\"${q.id}\">＋ Item</button>"""
          delete_button=button+"""<button type=\"button\" class=\"btn tiny danger\" data-action=\"delete-quote\" data-id=\"${q.id}\">Delete version</button>"""
          if 'data-action=\"delete-quote\"' not in s:
              if button not in s: raise SystemExit('quotation version button anchor missing')
              s=s.replace(button,delete_button,1)

          handler_anchor=""" 'edit-quote':({id})=>{const q=state.quotations.find(x=>x.id===id);if(!q)return;modal('Edit quotation',`<div class=\"form-grid\">${field('Package price (NPR)','qPackage','number',q.customer_total||'','required min=\"1\"')}${select('Status','qStatus',[['draft','Draft'],['sent','Sent'],['accepted','Accepted'],['rejected','Rejected']],q.status||'draft')}${textarea('Notes','qNotes',q.notes||'')}</div>`,`<button type=\"button\" class=\"btn primary\" data-action=\"save-quote\" data-id=\"${id}\">Save quotation</button>`)},
"""
          if 'data-action=\"delete-quote\"' not in s:
              raise SystemExit('quotation delete button was not added')
          if " 'delete-quote':async" not in s:
              if handler_anchor not in s: raise SystemExit('edit-quote handler anchor missing')
              s=s.replace(handler_anchor,handler_anchor+""" 'delete-quote':async({id})=>{if(!confirm('Delete this quotation version and all its items?'))return;await safe(async()=>{await A.deleteQuotation(id);render();toast('Quotation version deleted')})},
""",1)

          p.write_text(s)
          PY
          node --check app.js
          grep -Fq "async function deleteQuotation" app.js
          grep -Fq "deleteQuotation" app.js
          grep -Fq "data-action=\"delete-quote\"" app.js
          rm -f .github/workflows/inspect-quotation.yml
          git add app.js .github/workflows/inspect-quotation.yml
          git commit -m "[quote-version-fix] Make quotation version deletion functional"
          git push origin HEAD:main
          rm -f .github/workflows/fix-quotation-package.yml
          git add .github/workflows/fix-quotation-package.yml
          git commit -m "[quote-version-fix] Remove temporary quotation repair workflow"
          git push origin HEAD:main
