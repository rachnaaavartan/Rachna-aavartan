name: Repair quotation version deletion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[quote-version-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quotation version deletion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()

          anchor="""  async function deleteQuoteItem(id) {
    if (!id) throw new Error('Quotation item ID is required');
    const item = state.quotationItems.find(x => x.id === id);
    await q(sb.from('quotation_items').delete().eq('id', id));
    if (item?.quotation_id) {
      const qrow = state.quotations.find(q => q.id === item.quotation_id);
      if (qrow) await recalc(qrow.project_id);
    } else await refresh();
    return true;
  }
"""
          if anchor not in s: raise SystemExit('deleteQuoteItem anchor missing')
          version_fn=anchor+"""
  async function deleteQuotation(id) {
    if (!id) throw new Error('Quotation ID is required');
    const qrow = state.quotations.find(q => q.id === id);
    if (!qrow) throw new Error('Quotation version not found');
    await q(sb.from('quotation_items').delete().eq('quotation_id', id));
    await q(sb.from('quotations').delete().eq('id', id));
    if (qrow.project_id) await recalc(qrow.project_id); else await refresh();
    return true;
  }
"""
          s=s.replace(anchor,version_fn,1)

          api_old="""    recordPayment, recordExpense, recordAdvance,
    createQuotation, updateQuotation, addQuoteItem, deleteQuoteItem, createQuoteVersionFrom, recalc,
"""
          api_new="""    recordPayment, recordExpense, recordAdvance,
    createQuotation, updateQuotation, addQuoteItem, deleteQuoteItem, deleteQuotation, createQuoteVersionFrom, recalc,
"""
          if api_old not in s:
              # Current source may not yet contain the item deletion update; support that state too.
              api_old="""    recordPayment, recordExpense, recordAdvance,
    createQuotation, updateQuotation, addQuoteItem, createQuoteVersionFrom, recalc,
"""
              api_new="""    recordPayment, recordExpense, recordAdvance,
    createQuotation, updateQuotation, addQuoteItem, deleteQuoteItem, deleteQuotation, createQuoteVersionFrom, recalc,
"""
          if api_old not in s: raise SystemExit('quotation API export anchor missing')
          s=s.replace(api_old,api_new,1)

          # Add a real Delete version button to every quotation version card.
          old_button="""<button type=\"button\" class=\"btn tiny\" data-action=\"add-quote-item\" data-id=\"${q.id}\">＋ Item</button>"""
          new_button=old_button+"""<button type=\"button\" class=\"btn tiny danger\" data-action=\"delete-quote\" data-id=\"${q.id}\">Delete version</button>"""
          if old_button in s: s=s.replace(old_button,new_button,1)
          else: raise SystemExit('quotation version button anchor missing')

          # Add the handler immediately after edit-quote so the action is part of the canonical handler table.
          handler_anchor=""" 'edit-quote':({id})=>{const q=state.quotations.find(x=>x.id===id);if(!q)return;modal('Edit quotation',`<div class=\"form-grid\">${field('Package price (NPR)','qPackage','number',q.customer_total||'','required min=\"1\"')}${select('Status','qStatus',[['draft','Draft'],['sent','Sent'],['accepted','Accepted'],['rejected','Rejected']],q.status||'draft')}${textarea('Notes','qNotes',q.notes||'')}</div>`,`<button type=\"button\" class=\"btn primary\" data-action=\"save-quote\" data-id=\"${id}\">Save quotation</button>`)},
"""
          if handler_anchor not in s:
              raise SystemExit('edit-quote handler anchor missing')
          handler_new=handler_anchor+""" 'delete-quote':async({id})=>{if(!confirm('Delete this quotation version and all its items?'))return;await safe(async()=>{await A.deleteQuotation(id);render();toast('Quotation version deleted')})},
"""
          s=s.replace(handler_anchor,handler_new,1)

          p.write_text(s)
          PY
          node --check app.js
          grep -Fq "async function deleteQuotation" app.js
          grep -Fq "data-action=\"delete-quote\"" app.js
          grep -Fq "deleteQuotation" app.js

          rm -f .github/workflows/inspect-quotation.yml
          git add app.js .github/workflows/fix-quotation-package.yml .github/workflows/inspect-quotation.yml
          git commit -m "[quote-version-fix] Make quotation version deletion functional"
          git push origin HEAD:main
