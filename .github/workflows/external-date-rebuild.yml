name: Replace BS date system

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[external-date-rebuild]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace internal date implementation with external picker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js').read_text()
          idx = Path('index.html').read_text()

          # Remove the old nepali-date-converter dependency and load the external UI picker.
          old_dep = '<script src="https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js"></script>'
          idx = idx.replace(old_dep, '''<link rel="stylesheet" href="https://nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/css/nepali.datepicker.v5.0.4.min.css">
          <script src="https://nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/js/nepali.datepicker.v5.0.4.min.js"></script>''')
          idx = idx.replace('app.js?v=20260905.26', 'app.js?v=20260905.30')
          idx = idx.replace('manifest.webmanifest?v=20260905.26', 'manifest.webmanifest?v=20260905.30')
          idx = idx.replace('styles.css?v=20260905.26', 'styles.css?v=20260905.30')
          idx = idx.replace('sw.js?v=20260905.26', 'sw.js?v=20260905.30')

          # External library gate. No internal NP converter remains in production runtime.
          app = app.replace("const NP=window.NepaliDate;\nif(!A||!NP){", "const DATE=window.NepaliFunctions;\nif(!A||!DATE||typeof HTMLInputElement.prototype.nepaliDatePicker!=='function'){")

          start = app.index('const todayAD=()=>')
          end = app.index('const modal=', start)
          external_date = r'''const todayAD=()=>{const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kathmandu',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o={};f.forEach(x=>{if(x.type!=='literal')o[x.type]=x.value});return `${o.year}-${o.month}-${o.day}`};
          const fmt2=n=>String(n).padStart(2,'0');
          const normalizeDate=v=>{const m=String(v||'').match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})$/);return m?`${m[1]}-${fmt2(m[2])}-${fmt2(m[3])}`:''};
          const adOfBs=bs=>{try{const v=DATE.BS2AD(String(bs||''));if(typeof v==='string'){const m=v.match(/\\d{4}[-/ ]\\d{1,2}[-/ ]\\d{1,2}/);return m?m[0].replace(/[\\/ ]/g,'-').split('-').map((x,i)=>i===0?x:fmt2(x)).join('-'):''}return v&&v.year&&v.month&&v.day?`${v.year}-${fmt2(v.month)}-${fmt2(v.day)}`:''}catch(_){return''}};
          const bsOfAd=ad=>{try{const v=DATE.AD2BS(String(ad||'').slice(0,10));if(typeof v==='string'){const m=v.match(/\\d{4}[-/ ]\\d{1,2}[-/ ]\\d{1,2}/);return m?normalizeDate(m[0].replace(/[\\/ ]/g,'-')):''}return v&&v.bsYear&&v.bsMonth&&v.bsDate?`${v.bsYear}-${fmt2(v.bsMonth)}-${fmt2(v.bsDate)}`:''}catch(_){return''}};
          const todayBS=()=>bsOfAd(todayAD());
          const picker=(id,value='')=>`<input class="bs-date-input" data-bs-date id="${esc(id)}" value="${esc(normalizeDate(value))}" type="text" inputmode="none" autocomplete="off" placeholder="Select BS date" readonly>`;
          const pickerValue=id=>normalizeDate($(`[data-bs-date="#${CSS.escape(id)}"]`)?.value||$(`[data-bs-date]#${CSS.escape(id)}`)?.value||'');
          const bindDatePickers=root=>{$$('.bs-date-input',root).forEach(input=>{if(input.dataset.bsBound)return;input.dataset.bsBound='1';input.nepaliDatePicker({dateFormat:'%y-%m-%d',closeOnDateSelect:true});input.addEventListener('dateSelect',()=>{input.value=normalizeDate(input.value)})})};
          '''
          app = app[:start] + external_date + app[end:]
          app = app.replace('bindPickers(m);', 'bindDatePickers(m);')
          app = app.replace("const dateField=(label,id,value='')=>`<label class=\\"field full\\"><span>${esc(label)}</span>${picker(id,value)}</label>`;", "const dateField=(label,id,value='')=>`<label class=\\"field full\\"><span>${esc(label)}</span>${picker(id,value)}<small>BS · Bikram Sambat · Select from calendar</small></label>`;")
          # In case escaping above did not match, replace the literal source form too.
          app = app.replace('const dateField=(label,id,value=\'\')=>`<label class="field full"><span>${esc(label)}</span>${picker(id,value)}</label>`;', 'const dateField=(label,id,value=\'\')=>`<label class="field full"><span>${esc(label)}</span>${picker(id,value)}<small>BS · Bikram Sambat · Select from calendar</small></label>`;')

          # External picker outputs YYYY-MM-DD in the configured format; all storage paths already use pickerValue().
          # Initialize through the existing modal lifecycle, with no internal day/month calculation layer.
          if 'const NP=window.NepaliDate;' in app:
              raise SystemExit('Internal NepaliDate dependency still present')
          for bad in ('validDays(', 'daysInBsMonth(', 'const parts=', 'const MONTHS=', 'bindPickers('):
              if bad in app:
                  raise SystemExit('Old internal date code still present: ' + bad)
          if 'nepaliDatePicker({' not in app:
              raise SystemExit('External Nepali date picker was not initialized')
          if 'DATE.BS2AD' not in app or 'DATE.AD2BS' not in app:
              raise SystemExit('External BS/AD conversion API not wired')

          Path('app.js').write_text(app)
          Path('index.html').write_text(idx)
          PY

          node --check app.js
          grep -Fq 'nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/js/nepali.datepicker.v5.0.4.min.js' index.html
          grep -Fq 'nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/css/nepali.datepicker.v5.0.4.min.css' index.html
          ! grep -Fq 'nepali-date-converter/dist/nepali-date-converter.umd.js' index.html
          ! grep -Fq 'window.NepaliDate' app.js

      - name: Remove rebuild workflow and commit
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          rm -f .github/workflows/external-date-rebuild.yml
          git add app.js index.html .github/workflows/external-date-rebuild.yml
          git commit -m "[external-date-rebuild] Use external Nepali date picker"
          git push origin HEAD:main
