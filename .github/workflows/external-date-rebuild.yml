name: Replace BS date system
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[external-date-rebuild]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace internal date implementation with external picker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          idx_path = Path('index.html')
          app = app_path.read_text()
          idx = idx_path.read_text()

          old_dep = '<script src="https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js"></script>'
          ext_dep = '<link rel="stylesheet" href="https://nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/css/nepali.datepicker.v5.0.6.min.css"><script src="https://nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/js/nepali.datepicker.v5.0.6.min.js"></script>'
          idx = idx.replace(old_dep, ext_dep)
          idx = re.sub(r'app\\.js\\?v=20260905\\.\\d+', 'app.js?v=20260905.40', idx)
          idx = re.sub(r'manifest\\.webmanifest\\?v=20260905\\.\\d+', 'manifest.webmanifest?v=20260905.40', idx)
          idx = re.sub(r'styles\\.css\\?v=20260905\\.\\d+', 'styles.css?v=20260905.40', idx)
          idx = re.sub(r'sw\\.js\\?v=20260905\\.\\d+', 'sw.js?v=20260905.40', idx)

          app = app.replace("const NP=window.NepaliDate;\nif(!A||!NP){", "const DATE=window.NepaliFunctions;\nconst DATEPICKER=typeof HTMLInputElement.prototype.nepaliDatePicker==='function'?HTMLInputElement.prototype.nepaliDatePicker:(typeof HTMLInputElement.prototype.NepaliDatePicker==='function'?HTMLInputElement.prototype.NepaliDatePicker:null);\nif(!A||!DATE||!DATEPICKER){")

          start = app.index('const todayAD=()=>')
          end = app.index('const modal=', start)
          external_date = r'''const todayAD=()=>{const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kathmandu',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o={};f.forEach(x=>{if(x.type!=='literal')o[x.type]=x.value});return `${o.year}-${o.month}-${o.day}`};
          const fmt2=n=>String(n).padStart(2,'0');
          const asciiDigits=v=>String(v||'').replace(/[०-९]/g,ch=>String('१२३४५६७८९'.indexOf(ch)+1)).replace(/\u0966/g,'0');
          const normalizeDate=v=>{const m=asciiDigits(v).match(/^(\d{4})[-/ ](\d{1,2})[-/ ](\d{1,2})$/);return m?`${m[1]}-${fmt2(m[2])}-${fmt2(m[3])}`:''};
          const adOfBs=bs=>{try{const s=normalizeDate(bs);if(!s)throw new Error('Invalid BS date');const v=DATE.BS2AD(s,'YYYY-MM-DD','YYYY-MM-DD');return normalizeDate(v)}catch(_){return''}};
          const bsOfAd=ad=>{try{const s=String(ad||'').slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return'';return normalizeDate(DATE.AD2BS(s,'YYYY-MM-DD','YYYY-MM-DD'))}catch(_){return''}};
          const todayBS=()=>bsOfAd(todayAD());
          const picker=(id,value='')=>`<input class="bs-date-input" data-bs-date id="${esc(id)}" type="text" value="${esc(normalizeDate(value))}" placeholder="Select BS date" autocomplete="off" readonly>`;
          const pickerValue=id=>normalizeDate($('#'+CSS.escape(id))?.value||'');
          const bindDatePickers=root=>{$$('.bs-date-input',root).forEach(input=>{if(input.dataset.bsBound)return;input.dataset.bsBound='1';DATEPICKER.call(input,{dateFormat:'%y-%m-%d',closeOnDateSelect:true});input.addEventListener('dateSelect',()=>{input.value=normalizeDate(input.value)})})};
          '''
          app = app[:start] + external_date + app[end:]
          app = app.replace('bindPickers(m);', 'bindDatePickers(m);')
          app = re.sub(r"const dateField=\(label,id,value=''\)=>`<label class=\\\"field full\\\"><span>\$\{esc\(label\)\}</span>\$\{picker\(id,value\)\}</label>`;", "const dateField=(label,id,value='')=>`<label class=\"field full\"><span>${esc(label)}</span>${picker(id,value)}<small>BS · Bikram Sambat · Select from calendar</small></label>`;", app)
          if 'const NP=window.NepaliDate;' in app or 'validDays(' in app or 'daysInBsMonth(' in app or 'bindPickers(' in app:
              raise SystemExit('Old internal date-picker code remains')
          if 'DATE.BS2AD' not in app or 'DATE.AD2BS' not in app or 'bindDatePickers' not in app:
              raise SystemExit('External date adapter was not installed')
          app_path.write_text(app)
          idx_path.write_text(idx)
          PY
          node --check app.js
          grep -Fq 'nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/js/nepali.datepicker.v5.0.6.min.js' index.html
          grep -Fq 'nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/css/nepali.datepicker.v5.0.6.min.css' index.html
          ! grep -Fq 'nepali-date-converter/dist/nepali-date-converter.umd.js' index.html
          ! grep -Fq 'window.NepaliDate' app.js
      - name: Remove rebuild workflow and commit
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          rm -f .github/workflows/external-date-rebuild.yml
          git add app.js index.html .github/workflows/external-date-rebuild.yml
          git commit -m "[external-date-rebuild] Replace internal BS picker with external calendar"
          git push origin HEAD:main
