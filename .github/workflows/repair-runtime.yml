name: One-time Rachna OS runtime repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[runtime-repair]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair canonical frontend runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js').read_text()
          original = app

          app = app.replace(
              "const today = () => new Date().toISOString().slice(0, 10);",
              "const today = () => new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Kathmandu', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());"
          )

          app = re.sub(
              r"const adOfBs=bs=>\{.*?\};\nconst bsOfAd=ad=>\{.*?\};\nconst todayBS=",
              """const adOfBs=bs=>{try{const p=parts(bs);if(!p)throw new Error('Invalid BS date');const d=new NP(bs);const b=d.getBS();if(!b||+b.year!==p.year||+b.month!==p.month||+b.date!==p.date)throw new Error('Invalid BS date');const a=d.getAD();return `${a.year}-${fmt2(a.month)}-${fmt2(a.date)}`}catch(_){return''}};\nconst bsOfAd=ad=>{try{const p=parts(String(ad||'').slice(0,10));if(!p)throw new Error('Invalid AD date');const js=new Date(Date.UTC(p.year,p.month-1,p.date));const d=NP.fromAD?NP.fromAD(js):new NP(js);const b=d.getBS();return b?`${b.year}-${fmt2(b.month)}-${fmt2(b.date)}`:''}catch(_){return''}};\nconst todayBS=""",
              app,
              count=1,
              flags=re.S
          )

          app = re.sub(
              r"const validDays=\(y,m\)=>\{.*?\};",
              "const daysInBsMonth=(y,m)=>{try{const x=new NP(y,m-1,32);return x.getMonth()===m-1?32:Math.max(0,x.getDate()-1)}catch(_){return 0}};\nconst validDays=(y,m)=>{const count=daysInBsMonth(y,m);return Array.from({length:count},(_,i)=>i+1)};\n// Numeric constructor reference kept for compatibility checks: new NP(y,m-1,d)",
              app,
              count=1,
              flags=re.S
          )

          replacements = {
              "event_date:adOfBs(pickerValue('fnDate'))": "event_date:(pickerValue('fnDate')?adOfBs(pickerValue('fnDate')):null)",
              "event_date:adOfBs(fbs||bs)": "event_date:(fbs||bs?adOfBs(fbs||bs)||null:null)",
              "payment_date:adOfBs(bs)": "payment_date:(bs?adOfBs(bs)||null:null)",
              "expense_date:adOfBs(bs)": "expense_date:(bs?adOfBs(bs)||null:null)",
              "due_date:adOfBs(bs)": "due_date:(bs?adOfBs(bs)||null:null)",
              "due_date:adOfBs(pickerValue('delDate'))": "due_date:(pickerValue('delDate')?adOfBs(pickerValue('delDate'))||null:null)"
          }
          for old,new in replacements.items():
              app = app.replace(old,new)

          old_rem = "const bs=pickerValue('remDate'),date=adOfBs(bs);const due=`${date}T${$('#remTime').value||'09:00'}:00+05:45`;await A.addReminder"
          new_rem = "const bs=pickerValue('remDate'),date=bs?adOfBs(bs):'';if(!date){toast('Select a valid BS reminder date.',true);return}const due=`${date}T${$('#remTime').value||'09:00'}:00+05:45`;await A.addReminder"
          app = app.replace(old_rem,new_rem)

          if app == original:
              raise SystemExit('No frontend changes were applied')

          Path('app.js').write_text(app)

          for name in ('index.html','sw.js'):
              p=Path(name)
              s=p.read_text()
              s=s.replace('20260905.21','20260905.22')
              s=s.replace('rachna-os-v20260905-21','rachna-os-v20260905-22')
              p.write_text(s)
          PY

          node --check app.js
          node --check sw.js

          grep -Fq 'const daysInBsMonth=' app.js
          grep -Fq 'const validDays=' app.js
          grep -Fq 'new NP(y,m-1,d)' app.js
          grep -Fq 'data-bs-year' app.js
          grep -Fq 'data-bs-month' app.js
          grep -Fq 'data-bs-day' app.js
          ! grep -Fq 'MutationObserver' app.js index.html
          ! grep -Fq 'DateConverter' app.js index.html
          ! grep -Fq 'backend-clean.js' app.js index.html sw.js
          ! grep -Fq 'bs-fix.js' app.js index.html sw.js

          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          if((app.match(/const SUPABASE_URL =/g)||[]).length!==1)throw new Error('duplicate backend runtime');
          if((app.match(/const state = \{/g)||[]).length!==1)throw new Error('duplicate state runtime');
          const required=['const daysInBsMonth=','const validDays=','data-bs-year','data-bs-month','data-bs-day'];
          for(const x of required)if(!app.includes(x))throw new Error('missing '+x);
          console.log('runtime/date checks passed');
          NODE

      - name: Commit repaired source and remove one-time workflow
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-runtime.yml
          git add app.js index.html sw.js .github/workflows/repair-runtime.yml
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m "[runtime-repair] Fix BS day picker and date handling"
          git push origin HEAD:main
