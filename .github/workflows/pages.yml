name: Deploy Rachna OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production runtime
        run: |
          node --check app.js
          node --check backend-clean.js
          test -f index.html
          test -f styles.css
          test -f sw.js
          test -f manifest.webmanifest
          test -f supabase/schema.sql
          ! grep -Eo 'os-[A-Za-z0-9._-]+\.(js|css)' index.html
          ! grep -Eo 'os-[A-Za-z0-9._-]+\.(js|css)' sw.js
          ! grep -Eo 'os-[A-Za-z0-9._-]+\.(js|css)' .github/workflows/pages.yml
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
