name: Deploy Rachna OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate clean production runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          test -f index.html
          test -f styles.css
          test -f sw.js
          test -f manifest.webmanifest
          test -f supabase/schema.sql

          test "$(grep -Fc 'const SUPABASE_URL =' app.js)" -eq 1
          test "$(grep -Fc 'const state = {' app.js)" -eq 1
          grep -Fq 'const NP=window.NepaliDate;' app.js
          grep -Fq 'const validDays=' app.js
          grep -Fq 'new NP(y,m-1,d)' app.js
          grep -Fq 'data-bs-year' app.js
          grep -Fq 'data-bs-month' app.js
          grep -Fq 'data-bs-day' app.js

          ! grep -Fq 'DateConverter' index.html app.js
          ! grep -Fq 'nativeAdd' index.html app.js
          ! grep -Fq 'MutationObserver' index.html app.js
          ! grep -Fq 'type="date"' index.html app.js
          ! grep -Fq 'backend-clean.js' index.html app.js sw.js
          ! grep -Fq 'ui.css' index.html app.js sw.js
          ! grep -Fq 'bs-fix.js' index.html app.js sw.js
          ! grep -Fq 'repair-unified-runtime' index.html app.js sw.js
          ! grep -Fq 'final-cleanup' index.html app.js sw.js
          ! grep -Fq 'final-clean-source' index.html app.js sw.js

          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          if((app.match(/const SUPABASE_URL =/g)||[]).length!==1)throw new Error('Duplicate backend runtime');
          if((app.match(/const state = \{/g)||[]).length!==1)throw new Error('Duplicate state runtime');
          if(html.includes('DateConverter')||html.includes('nativeAdd')||html.includes('MutationObserver'))throw new Error('Extra HTML runtime layer remains');
          const m=app.match(/const HANDLERS=\{([\s\S]*?)\n\};/);const r=app.match(/const ROUTES=\{([\s\S]*?)\};/);
          if(!m||!r)throw new Error('Handler or route registry missing');
          const actions=[...app.matchAll(/data-action=["']([^"']+)["']/g)].map(x=>x[1]).filter(x=>!x.includes('$'));
          const handlers=new Set([...m[1].matchAll(/(?:^|,)\s*['"]?([A-Za-z0-9_-]+)['"]?\s*:/g)].map(x=>x[1]));
          if(app.includes("HANDLERS['sign-in-panel']"))handlers.add('sign-in-panel');
          const missing=[...new Set(actions)].filter(x=>!handlers.has(x));
          if(missing.length)throw new Error('Unwired actions: '+missing.join(', '));
          const routes=[...app.matchAll(/data-route=["']([^"']+)["']/g)].map(x=>x[1]).filter(x=>!x.includes('$'));
          const routeKeys=new Set([...r[1].matchAll(/(?:^|,)\s*['"]?([A-Za-z0-9_-]+)['"]?\s*:/g)].map(x=>x[1]));
          const bad=[...new Set(routes)].filter(x=>!routeKeys.has(x));
          if(bad.length)throw new Error('Unwired routes: '+bad.join(', '));
          if(sw.includes('patchIndex')||sw.includes('bs-fix'))throw new Error('Service-worker patch layer remains');
          console.log(`Verified ${new Set(actions).size} actions, ${new Set(routes).size} routes, one backend runtime, direct BS picker.`);
          NODE

          curl -fsSL -o /dev/null https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
