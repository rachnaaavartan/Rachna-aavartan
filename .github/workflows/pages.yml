name: Deploy Rachna OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production files
        run: |
          node --check app.js
          node --check backend-clean.js
          node --check os-hardening.js
          node --check os-integrations.js
          node --check os-qa.js
          node --check os-production.js
          node --check os-ux.js
          node --check os-crew.js
          node --check os-crew-v2.js
          node --check os-finance-v2.js
          node --check os-operations-v2.js
          node --check os-crm-v2.js
          node --check os-documents-v2.js
          node --check os-marketing-v2.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f supabase/migrations/20260903_client_portal_pwa.sql
          test -f supabase/migrations/20260903_production_cost_hardening.sql
          test -f supabase/migrations/20260903_lock_vendor_payment_fields.sql
          test -f supabase/migrations/20260904_function_crew_requirements.sql
          test -f supabase/migrations/20260904_event_operations_tasks.sql
          test -f supabase/migrations/20260904_documents.sql
          test -f supabase/migrations/20260904_marketing_ads.sql
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4