name: Deploy Rachna OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production files
        run: |
          for f in app.js backend-clean.js os-data-v2.js os-performance.js os-hardening.js os-integrations.js os-qa.js os-production.js os-ux.js os-crew-v2.js os-finance-v2.js os-operations-v3.js os-documents-v2.js os-marketing-v2.js os-workflow-v3.js os-complete-v4.js os-complete-v4-fix.js os-resource-planner-v1.js os-dayone-v2.js os-stability-v1.js os-nepali-calendar-v1.js os-company-units-v1.js; do node --check "$f"; done
          test -f index.html
          test -f styles.css
          test -f os-complete-v4.css
          test -f os-dayone-v1.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f os-company-units-v1.js
          test -f supabase/migrations/20260903_client_portal_pwa.sql
          test -f supabase/migrations/20260903_production_cost_hardening.sql
          test -f supabase/migrations/20260903_lock_vendor_payment_fields.sql
          test -f supabase/migrations/20260904_function_crew_requirements.sql
          test -f supabase/migrations/20260904_event_operations_tasks.sql
          test -f supabase/migrations/20260904_documents.sql
          test -f supabase/migrations/20260904_marketing_ads.sql
          test -f supabase/migrations/20260904_workflow_document_links.sql
          test -f supabase/migrations/20260904_company_os_hardening.sql
          test -f supabase/migrations/20260904_resource_conflict_hardening.sql
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
