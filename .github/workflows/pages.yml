name: Deploy Rachna OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize to one runtime
        run: node .github/repair-unified-runtime.cjs
      - name: Commit normalized production tree
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Unify runtime, close modals reliably, and standardize BS UI'
            git push origin HEAD:main
          fi
      - name: Validate production runtime
        run: |
          set -e
          node --check app.js
          test -f index.html
          test -f styles.css
          test -f sw.js
          test -f manifest.webmanifest
          test -f supabase/schema.sql
          ! find . -maxdepth 1 -type f -name 'os-*' -print -quit | grep -q .
          ! grep -Eo 'os-[A-Za-z0-9._-]+\.(js|css)' index.html
          ! grep -Eo 'os-[A-Za-z0-9._-]+\.(js|css)' sw.js
          ! grep -E '30% advance gate|30% advance is the booking gate|Confirmed after advance' app.js
          ! grep -F 'type="date"' app.js index.html
          ! grep -F 'backend-clean.js' index.html sw.js app.js
          ! grep -F 'ui.css' index.html sw.js
          test ! -e backend-clean.js
          test ! -e ui.css
          grep -Fq "const booked=p=>p?.status==='booked';" app.js
          grep -q 'event_date_bs' app.js
          grep -q 'data-bs-year' app.js
          grep -q 'data-bs-month' app.js
          grep -q 'data-bs-day' app.js
          grep -Fq "ui.page='settings';ui.tab='overview'" app.js
          grep -Fq "ui.query=stage||''" app.js
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          const m=app.match(/const HANDLERS=\{([\s\S]*?)\n\};/);
          const r=app.match(/const ROUTES=\{([\s\S]*?)\};/);
          if(!m||!r) throw new Error('Handler or route registry missing');
          const actions=[...app.matchAll(/data-action=["']([^"']+)["']/g)].map(x=>x[1]).filter(x=>!x.includes('$'));
          const handlers=new Set([...m[1].matchAll(/(?:^|,)\s*['"]?([A-Za-z0-9_-]+)['"]?\s*:/g)].map(x=>x[1]));
          if(app.includes("HANDLERS['sign-in-panel']")) handlers.add('sign-in-panel');
          const missing=[...new Set(actions)].filter(x=>!handlers.has(x));
          if(missing.length) throw new Error('Unwired actions: '+missing.join(', '));
          const routes=[...app.matchAll(/data-route=["']([^"']+)["']/g)].map(x=>x[1]).filter(x=>!x.includes('$'));
          const routeKeys=new Set([...r[1].matchAll(/(?:^|,)\s*['"]?([A-Za-z0-9_-]+)['"]?\s*:/g)].map(x=>x[1]));
          const badRoutes=[...new Set(routes)].filter(x=>!routeKeys.has(x));
          if(badRoutes.length) throw new Error('Unwired routes: '+badRoutes.join(', '));
          console.log(`Verified ${new Set(actions).size} literal actions and ${new Set(routes).size} literal routes.`);
          NODE
          curl -fsSL -o /dev/null https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
