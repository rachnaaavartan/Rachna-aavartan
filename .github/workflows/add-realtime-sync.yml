name: Add realtime data synchronization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[realtime-sync]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add canonical realtime synchronization to app.js
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          if 'function startRealtimeSync()' not in s:
              anchor="""  async function init() {\n    const { data, error } = await sb.auth.getSession();\n    if (error) throw error;\n    state.user = data.session?.user || null;\n    state.connected = !!state.user;\n    if (state.user) {\n      await loadProfile();\n      await refresh();\n    }\n    return state;\n  }\n"""
              replacement="""  let realtimeChannel = null;\n  let realtimeTimer = null;\n  let realtimeRefreshing = false;\n\n  async function syncNow() {\n    if (!state.user || realtimeRefreshing) return;\n    realtimeRefreshing = true;\n    try {\n      await refresh();\n      if (typeof render === 'function') render();\n    } finally {\n      realtimeRefreshing = false;\n    }\n  }\n\n  function startRealtimeSync() {\n    if (!state.user) return;\n    if (realtimeChannel) { try { sb.removeChannel(realtimeChannel); } catch (_) {} }\n    const tables = DATASETS.map(x => x[0]);\n    realtimeChannel = sb.channel('rachna-live-sync-' + state.user.id);\n    tables.forEach(table => {\n      realtimeChannel.on('postgres_changes', { event: '*', schema: 'public', table }, () => {\n        clearTimeout(realtimeTimer);\n        realtimeTimer = setTimeout(() => { syncNow().catch(() => {}); }, 150);\n      });\n    });\n    realtimeChannel.subscribe();\n  }\n\n  async function init() {\n    const { data, error } = await sb.auth.getSession();\n    if (error) throw error;\n    state.user = data.session?.user || null;\n    state.connected = !!state.user;\n    if (state.user) {\n      await loadProfile();\n      await refresh();\n      startRealtimeSync();\n    }\n    return state;\n  }\n"""
              if anchor not in s: raise SystemExit('init anchor missing')
              s=s.replace(anchor,replacement,1)
          else:
              s=s.replace('      await refresh();\n    }\n    return state;\n  }\n\n  async function signIn', '      await refresh();\n      startRealtimeSync();\n    }\n    return state;\n  }\n\n  async function signIn',1)
          p.write_text(s)
          PY
          node --check app.js
          grep -Fq 'function startRealtimeSync()' app.js
          grep -Fq "postgres_changes" app.js
          grep -Fq "startRealtimeSync();" app.js
          rm -f .github/workflows/add-realtime-sync.yml
          git add app.js .github/workflows/add-realtime-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "[realtime-sync] Keep linked data synchronized across the app"
          git push origin HEAD:main
