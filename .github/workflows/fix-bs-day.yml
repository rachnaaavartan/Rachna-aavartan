name: Fix BS day selector

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[bs-day-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace broken day-count calculation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.js')
          s = p.read_text()
          old = "const daysInBsMonth=(y,m)=>{try{const x=new NP(y,m-1,32);return x.getMonth()===m-1?32:Math.max(0,x.getDate()-1)}catch(_){return 0}};"
          new = "const daysInBsMonth=(y,m)=>{let last=0;for(let d=1;d<=32;d++){try{const x=new NP(y,m-1,d);if(x.getYear()===y&&x.getMonth()===m-1&&x.getDate()===d)last=d;else break}catch(_){break}}return last};"
          if old not in s:
              raise SystemExit('Expected broken day-count function was not found')
          p.write_text(s.replace(old, new, 1))

          for name in ('index.html','sw.js'):
              q=Path(name)
              t=q.read_text()
              t=t.replace('20260905.22','20260905.23')
              t=t.replace('rachna-os-v20260905-22','rachna-os-v20260905-23')
              q.write_text(t)
          PY

          node --check app.js
          node --check sw.js
          grep -Fq "const daysInBsMonth=(y,m)=>{let last=0;" app.js
          ! grep -Fq "Math.max(0,x.getDate()-1)" app.js

      - name: Remove one-time workflow and commit
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-bs-day.yml
          git add app.js index.html sw.js .github/workflows/fix-bs-day.yml
          git commit -m "[bs-day-fix] Fix BS day selector"
          git push origin HEAD:main
