name: Fix BS day picker now

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[date-picker-fixed]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply canonical date-picker fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js').read_text()

          # The library uses a zero-based monthIndex in the numeric constructor.
          # Use setDate(32) from day 1 to determine the exact length of the
          # selected BS month without parsing/rounding a potentially invalid date.
          new_days = "const daysInBsMonth=(y,m)=>{try{const x=new NP(y,m-1,1);x.setDate(32);return x.getMonth()===m-1?x.getDate():32-x.getDate()}catch(_){return 0}};"
          app, count = re.subn(r"const daysInBsMonth=.*?;\nconst validDays=", new_days + "\nconst validDays=", app, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate daysInBsMonth')

          # Keep BS month formatting/storage in the human-facing 1..12 form.
          app = app.replace(
              "const fmtBs=o=>o?`${o.year}-${fmt2(o.month)}-${fmt2(o.date)}`:'';",
              "const fmtBs=o=>o?`${o.year}-${fmt2(+o.month+1)}-${fmt2(o.date)}`:'';",
              1,
          )
          app = app.replace(
              "if(!b||+b.year!==p.year||+b.month!==p.month||+b.date!==p.date)throw new Error('Invalid BS date');",
              "if(!b||+b.year!==p.year||+b.month+1!==p.month||+b.date!==p.date)throw new Error('Invalid BS date');",
              1,
          )
          app = app.replace(
              "return b?`${b.year}-${fmt2(b.month)}-${fmt2(b.date)}`:''",
              "return b?`${b.year}-${fmt2(+b.month+1)}-${fmt2(b.date)}`:''",
              1,
          )

          Path('app.js').write_text(app)

          # Bust service-worker and script caches without adding another runtime layer.
          for name in ('index.html', 'sw.js'):
              p = Path(name)
              text = p.read_text()
              text = re.sub(r'20260905\.\d+', '20260905.26', text)
              text = re.sub(r'rachna-os-v20260905-\d+', 'rachna-os-v20260905-26', text)
              p.write_text(text)

          # Remove this workflow after the fix; it must not become production runtime code.
          PY

          node --check app.js
          node --check sw.js

          grep -Fq 'const daysInBsMonth=(y,m)=>{try{const x=new NP(y,m-1,1);x.setDate(32)' app.js
          grep -Fq 'const validDays=' app.js
          grep -Fq 'data-bs-day' app.js
          ! grep -Fq 'Math.max(0,x.getDate()-1)' app.js

      - name: Commit and remove one-time workflow
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-date-picker-now.yml
          git add app.js index.html sw.js .github/workflows/fix-date-picker-now.yml
          git diff --cached --quiet && exit 0
          git commit -m '[date-picker-fixed] Fix BS day picker using calendar month length'
          git push origin HEAD:main
