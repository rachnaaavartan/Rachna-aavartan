name: Fix Home Inquiry Visibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix home dashboard inquiry visibility') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add recent enquiries to Home dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app.js')
          s=p.read_text()
          start=s.index('function homePage(){')
          end=s.index('\nfunction inquiriesPage(){', start)
          new='''function homePage(){const open=state.inquiries.filter(i=>!['lost','cancelled','booking_cancelled','booked','booked_elsewhere'].includes(i.status)).length;const bp=state.projects.filter(booked).length;const received=state.payments.filter(x=>x.direction==='in').reduce((a,x)=>a+Number(x.amount||0),0);const upcoming=state.functions.filter(x=>x.event_date_bs).slice(0,6);const due=state.reminders.filter(x=>x.status==='open').slice(0,5);const recentInquiries=[...state.inquiries].sort((a,b)=>String(b.updated_at||b.created_at||'').localeCompare(String(a.updated_at||a.created_at||''))).slice(0,6);return pageHead('RACHNA + AAVARTAN','Business Command Center','Run the business from enquiry to event day.',`<button type="button" class="btn" data-action="quick-action">⚡ Quick action</button><button type="button" class="btn primary" data-action="new-inquiry">＋ New enquiry</button>`)+`<div class="metrics">${metric('Open enquiries',open,'Sales pipeline')}${metric('Booked events',bp,'Manual booking status')}${metric('Cash received',money(received),'Customer payments')}${metric('Upcoming functions',upcoming.length,'BS calendar')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-title"><div><div class="eyebrow">SALES</div><h2>Enquiry pipeline</h2><p>Move enquiries forward without changing booking automatically.</p></div><button type="button" class="link" data-route="inquiries">Open enquiries →</button></div><div class="pipeline-mini">${INQUIRY_STAGES.slice(0,8).map(([k,l])=>`<button type="button" data-action="filter-inquiry" data-stage="${k}"><span>${esc(l)}</span><b>${state.inquiries.filter(x=>x.status===k).length}</b></button>`).join('')}</div></section><section class="panel"><div class="panel-title"><div><div class="eyebrow">RECENT ENQUIRIES</div><h2>Latest leads</h2><p>Newest enquiries added to the system.</p></div><button type="button" class="link" data-route="inquiries">View all →</button></div>${recentInquiries.map(i=>{const c=customerOf(i.customer_id);return `<div class="mini-row"><div><b>${esc(i.event_name||'Enquiry')}</b><small>${esc(c?.name||'No client')} · ${esc(i.event_date_bs||'Date TBC')} · ${esc(STATUS[i.status]||i.status||'New')}</small></div><button type="button" class="btn tiny" data-action="convert-inquiry" data-id="${i.id}">Create event</button></div>`}).join('')||empty('No enquiries yet','Create your first enquiry.')}</section></div><div class="dashboard-grid second"><section class="panel"><div class="panel-title"><div><div class="eyebrow">CALENDAR</div><h2>Upcoming functions</h2><p>All dates shown in BS.</p></div><button type="button" class="link" data-route="events">Open events →</button></div>${upcoming.map(f=>{const p=projectOf(f.project_id);return `<div class="mini-row"><div><b>${esc(f.name)}</b><small>${esc(f.event_date_bs||'Date TBC')} · ${esc(f.venue||'Venue TBC')}</small></div><button type="button" class="btn tiny" data-action="open-project" data-id="${f.project_id}">Open</button></div>`}).join('')||empty('No upcoming functions')}</section><section class="panel"><div class="panel-title"><div><div class="eyebrow">REMINDERS</div><h2>Attention</h2><p>Open work that needs follow-up.</p></div><button type="button" class="btn" data-action="new-reminder">＋ Reminder</button></div>${due.map(r=>`<div class="mini-row"><div><b>${esc(r.title)}</b><small>${r.due_at?bsOfAd(String(r.due_at).slice(0,10)):'No date'}</small></div><button type="button" class="btn tiny" data-action="done-reminder" data-id="${r.id}">Done</button></div>`).join('')||empty('No open reminders')}</section></div><div class="dashboard-grid second"><section class="panel"><div class="panel-title"><div><div class="eyebrow">FINANCE</div><h2>Cash overview</h2><p>Record customer receipts and business costs.</p></div><button type="button" class="link" data-route="finance">Finance →</button></div><div class="summary-bar"><span><b>${money(received)}</b> received</span><span><b>${money(state.expenses.reduce((a,x)=>a+Number(x.amount||0),0))}</b> expenses</span><span><b>${state.vendors.length}</b> vendors</span></div></section><section class="panel"><div class="panel-title"><div><div class="eyebrow">QUICK ACCESS</div><h2>Event operations</h2><p>Jump straight into the Event ID workflow.</p></div><button type="button" class="link" data-route="events">Open events →</button></div><div class="summary-bar"><span><b>${state.customers.length}</b> clients</span><span><b>${state.vendors.length}</b> vendors</span><span><b>${state.team.length}</b> crew</span></div></section></div>`}'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
          node --check app.js
          rm -f .github/workflows/fix-home-inquiries.yml
          git add app.js .github/workflows/fix-home-inquiries.yml
          git commit -m "Fix home dashboard inquiry visibility"
          git push origin HEAD:main
