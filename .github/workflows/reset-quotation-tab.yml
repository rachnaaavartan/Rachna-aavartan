name: Reset quotation tab cleanly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[quotation-tab-reset]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild canonical quotation tab
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js'); s=p.read_text()

          # Replace quotation API from createQuotation through createQuoteVersionFrom.
          a=s.index('  async function createQuotation(')
          b=s.index('  async function recalc(',a)
          block='''  async function createQuotation(projectId, options = {}) {
    const version = state.quotations.filter(q => q.project_id === projectId).reduce((max,q) => Math.max(max,n(q.version)),0)+1;
    return insert('quotations',{project_id:projectId,version,status:options.status||'draft',customer_total:n(options.customer_total),internal_total:0,notes:options.notes||null});
  }

  async function updateQuotation(id,row,projectId){
    await q(sb.from('quotations').update(row).eq('id',id));
    if(projectId) await recalc(projectId); else await refresh();
  }

  async function deleteQuotation(id){
    if(!id) throw new Error('Quotation version ID is required');
    const qrow=state.quotations.find(q=>q.id===id);
    if(!qrow) throw new Error('Quotation version not found');
    await q(sb.rpc('delete_quotation_version',{p_quotation_id:id}));
    await recalc(qrow.project_id);
    return true;
  }

  async function addQuoteItem(quotationId,x){
    assertText(x.description,'Item description is required');
    return q(sb.from('quotation_items').insert({quotation_id:quotationId,function_id:x.function_id||null,service_id:x.service_id||null,description:x.description.trim(),quantity:n(x.quantity,1),customer_price:x.customer_price===''||x.customer_price==null?null:n(x.customer_price),internal_cost:n(x.internal_cost)}).select().single()).then(async out=>{const qrow=state.quotations.find(q=>q.id===quotationId);if(qrow) await recalc(qrow.project_id); else await refresh();return out;});
  }

  async function deleteQuotationItem(id){
    if(!id) throw new Error('Quotation item ID is required');
    await q(sb.rpc('delete_quotation_item',{p_quotation_item_id:id}));
    await refresh();
    return true;
  }

  async function createQuoteVersionFrom(projectId,sourceId){
    const sourceQuote=state.quotations.find(q=>q.id===sourceId);
    const newQuote=await createQuotation(projectId,{customer_total:sourceQuote?.customer_total||0,notes:sourceQuote?.notes||null});
    const items=state.quotationItems.filter(i=>i.quotation_id===sourceId);
    for(const item of items) await q(sb.from('quotation_items').insert({quotation_id:newQuote.id,function_id:item.function_id,service_id:item.service_id,description:item.description,quantity:item.quantity,customer_price:item.customer_price,internal_cost:item.internal_cost}));
    await recalc(projectId);
    return newQuote;
  }

'''
          s=s[:a]+block+s[b:]

          # Replace only the quotation tab renderer up to vendors tab.
          a=s.index('function quotationTab(')
          b=s.index('function vendorsTab(',a)
          tab='''function quotationTab(p,qs,sv){
    const versions=qs.map(q=>{
      const items=state.quotationItems.filter(i=>i.quotation_id===q.id);
      return `<section class="panel quotation-version" data-quotation-id="${esc(q.id)}">
        <div class="section-head"><div><div class="eyebrow">QUOTATION VERSION</div><h2>Version ${esc(q.version||1)}</h2><p>${esc(STATUS[q.status]||q.status||'Draft')} · <b>Package ${money(q.customer_total)}</b></p></div>
          <div class="row-actions"><button type="button" class="btn tiny" data-action="edit-quote" data-id="${esc(q.id)}">Edit package</button><button type="button" class="btn tiny danger" data-action="delete-quote" data-id="${esc(q.id)}">Delete version</button></div></div>
        <div class="notice">Package price is the quotation total. Individual item prices are optional.</div>
        <div class="section-head"><div><div class="eyebrow">PACKAGE ITEMS</div><h3>Included items</h3></div><button type="button" class="btn" data-action="add-quote-item" data-id="${esc(q.id)}">＋ Add item</button></div>
        <div class="stack">${items.map(i=>`<div class="mini-row"><div><b>${esc(i.description)}</b><small>Qty ${esc(i.quantity||1)} · ${i.customer_price==null?'Included in package':money(i.customer_price)} · Internal ${money(i.internal_cost)}</small></div><button type="button" class="btn tiny danger" data-action="delete-quote-item" data-id="${esc(i.id)}">Delete item</button></div>`).join('')||empty('No items','Add items included in this package.')}</div>
      </section>`;
    }).join('');
    return `<section><div class="panel"><div class="section-head"><div><div class="eyebrow">QUOTATION</div><h2>Package quotations</h2><p>Each version is independent and can be deleted.</p></div><button type="button" class="btn primary" data-action="new-quote" data-project="${p.id}">＋ New quotation</button></div></div>${versions||empty('No quotations','Create your first package quotation.')}</section>`;
  }
'''
          s=s[:a]+tab+s[b:]

          # Replace quotation handlers with canonical handlers.
          def repl(name,text):
              nonlocal s
              rg=re.compile(r"\n\s*'"+re.escape(name)+r"':.*?(?=\n\s*'[^']+':|\n\s*\};)",re.S)
              m=rg.search(s)
              if not m: raise SystemExit('handler missing: '+name)
              s=s[:m.start()]+'\n '+text+s[m.end():]
          repl('new-quote',"'new-quote':({project})=>{const pid=project||ui.project;modal('New quotation',`<div class=\"form-grid\">${field('Package price (NPR)','newQPackage','number','','required min=\"1\"')}${textarea('Notes','newQNotes','')}</div><div class=\"notice\">Package price is required. Individual item prices are optional.</div>`,`<button type=\"button\" class=\"btn primary\" data-action=\"save-new-quote\" data-project=\"${pid}\">Create quotation</button>`)},")
          repl('edit-quote',"'edit-quote':({id})=>{const q=state.quotations.find(x=>x.id===id);if(!q)return;modal('Edit quotation',`<div class=\"form-grid\">${field('Package price (NPR)','qPackage','number',q.customer_total||'','required min=\"1\"')}${select('Status','qStatus',[['draft','Draft'],['sent','Sent'],['accepted','Accepted'],['rejected','Rejected']],q.status||'draft')}${textarea('Notes','qNotes',q.notes||'')}</div>`,`<button type=\"button\" class=\"btn primary\" data-action=\"save-quote\" data-id=\"${id}\">Save quotation</button>`)},")
          repl('save-quote',"'save-quote':async({id})=>safe(async()=>{const v=Number($('#qPackage').value||0);if(!(v>0)){toast('Package price is required.',true);return}await A.updateQuotation(id,{customer_total:v,status:$('#qStatus').value,notes:$('#qNotes').value},ui.project);closeModal();render();toast('Quotation updated')}),")
          repl('add-quote-item',"'add-quote-item':({id})=>modal('Add quotation item',`<div class=\"form-grid\">${field('Description','qiDescription','text','')}${field('Quantity','qiQty','number','1','min=\"1\"')}${field('Individual customer price (NPR) — optional','qiPrice','number','','min=\"0\"')}${field('Internal cost (NPR)','qiCost','number','0','min=\"0\"')}</div>`,`<button type=\"button\" class=\"btn primary\" data-action=\"save-quote-item\" data-id=\"${id}\">Add item</button>`),")
          repl('save-quote-item',"'save-quote-item':async({id})=>safe(async()=>{const desc=$('#qiDescription').value.trim();if(!desc){toast('Item description is required.',true);return}const raw=$('#qiPrice').value.trim();await A.addQuoteItem(id,{description:desc,quantity:Number($('#qiQty').value||1),customer_price:raw===''?null:Number(raw),internal_cost:Number($('#qiCost').value||0)});closeModal();render();toast('Quotation item added')}),")
          # Remove existing delete handlers if present, then add clean ones before vendor booking.
          for nm in ['delete-quote','delete-quote-item','save-new-quote']:
              try:
                  rg=re.compile(r"\n\s*'"+re.escape(nm)+r"':.*?(?=\n\s*'[^']+':|\n\s*\};)",re.S)
                  s=rg.sub('',s,count=1)
              except Exception: pass
          marker=" 'new-vendor-booking':"
          insert=""" 'save-new-quote':async({project})=>safe(async()=>{const v=Number($('#newQPackage').value||0);if(!(v>0)){toast('Package price is required.',true);return}await A.createQuotation(project||ui.project,{customer_total:v,notes:$('#newQNotes').value});closeModal();render();toast('Quotation created')}),
 'delete-quote':async({id})=>{if(!confirm('Delete this quotation version and all its items?'))return;await safe(async()=>{await A.deleteQuotation(id);render();toast('Quotation version deleted')})},
 'delete-quote-item':async({id})=>{if(!confirm('Delete this quotation item?'))return;await safe(async()=>{await A.deleteQuotationItem(id);render();toast('Quotation item deleted')})},
"""
          pos=s.index(marker); s=s[:pos]+insert+s[pos:]
          s=s.replace('createQuotation, updateQuotation, addQuoteItem, deleteQuoteItem, deleteQuotation, createQuoteVersionFrom, recalc,','createQuotation, updateQuotation, addQuoteItem, deleteQuoteItem, deleteQuotation, createQuoteVersionFrom, recalc,',1)
          p.write_text(s)

          # Remove every legacy quotation UX extension script from index.html.
          ip=Path('index.html'); h=ip.read_text()
          h=re.sub(r'\n<script>\n/\* Quotation UX extension\..*?</script>','',h,flags=re.S)
          h=h.replace('20260905.41','20260905.42').replace('20260905.40','20260905.42')
          ip.write_text(h)
          PY

          node --check app.js
          node --check sw.js
          grep -Fq 'function quotationTab' app.js
          grep -Fq 'data-action="delete-quote"' app.js
          grep -Fq 'data-action="delete-quote-item"' app.js
          grep -Fq 'async function deleteQuotation(id)' app.js
          grep -Fq 'async function deleteQuotationItem(id)' app.js
          ! grep -Fq 'Quotation UX extension' index.html
          ! grep -Fq 'MutationObserver' index.html

      - name: Commit clean reset
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          rm -f .github/workflows/reset-quotation-tab.yml
          git add app.js index.html .github/workflows/reset-quotation-tab.yml
          git diff --cached --quiet && exit 0
          git commit -m "[quotation-tab-reset] Rebuild quotation tab"
          git push origin HEAD:main
