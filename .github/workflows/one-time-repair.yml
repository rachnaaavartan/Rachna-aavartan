name: One-time runtime repair

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply unified runtime repair
        run: node .github/repair-unified-runtime.cjs
      - name: Validate repaired runtime
        run: |
          set -e
          node --check app.js
          test ! -e backend-clean.js
          test ! -e ui.css
          ! grep -F 'backend-clean.js' index.html sw.js app.js
          ! grep -F 'ui.css' index.html sw.js
          ! grep -F 'type="date"' index.html app.js
          grep -Fq "ui.page='settings';ui.tab='overview'" app.js
          grep -Fq "ui.query=stage||''" app.js
          grep -Fq "data-bs-year" app.js
          grep -Fq "data-bs-month" app.js
          grep -Fq "data-bs-day" app.js
      - name: Commit repaired production tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Unify runtime, close modals reliably, and standardize BS UI'
          git push origin HEAD:main
      - name: Dispatch production deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 'pages.yml' --ref main
