name: Add anti-duplicate interaction guard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[anti-duplicate]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install global double-submit protection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          marker = '<script id="anti-duplicate-guard">'
          if marker not in s:
              guard = r'''<script id="anti-duplicate-guard">
(() => {
  'use strict';
  const FAST_LOCK_MS = 900;
  const SAVE_LOCK_MS = 12000;
  const locked = new WeakSet();
  const writeAction = /^(save-|delete-|create-|add-|record-|update-|remove-|assign-|convert-|submit-|approve-|reject-)/i;
  const openAction = /^(new-|edit-|add-)/i;
  const shouldGuard = (btn) => {
    if (!btn || btn.tagName !== 'BUTTON' || btn.dataset?.noDedupe === '1') return false;
    if (btn.closest('.modal-foot')) return true;
    const action = btn.dataset?.action || '';
    if (writeAction.test(action)) return true;
    if (action && openAction.test(action)) return true;
    const label = (btn.textContent || '').trim();
    return /^(save|create|record|delete|add|update|remove|assign|convert|submit|approve|reject)\b/i.test(label);
  };
  document.addEventListener('click', (event) => {
    const btn = event.target?.closest?.('button');
    if (!shouldGuard(btn)) return;
    if (locked.has(btn) || btn.dataset.dedupeLock === '1') {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    locked.add(btn);
    btn.dataset.dedupeLock = '1';
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    const action = btn.dataset.action || '';
    const delay = btn.closest('.modal-foot') || writeAction.test(action) ? SAVE_LOCK_MS : FAST_LOCK_MS;
    window.setTimeout(() => {
      locked.delete(btn);
      if (btn.isConnected) {
        btn.disabled = false;
        delete btn.dataset.dedupeLock;
        btn.removeAttribute('aria-busy');
      }
    }, delay);
  }, true);
})();
</script>
'''
              m = re.search(r'(<script\s+src=["\']app\.js\?v=[^"\']+["\']></script>)', s)
              if not m:
                  raise SystemExit('app.js script tag not found')
              s = s[:m.start()] + guard + s[m.start():]

          # Force the browser and service worker to fetch the newest runtime.
          s = re.sub(r'20260905\.\d+', '20260905.43', s)
          p.write_text(s)
          PY

          node --check app.js
          node --check sw.js
          grep -Fq '<script id="anti-duplicate-guard">' index.html
          grep -Fq 'app.js?v=20260905.43' index.html
          ! grep -Fq 'data-bs-year' app.js

      - name: Commit guard and remove one-time workflow
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          rm -f .github/workflows/add-anti-duplicate-guard.yml
          git add index.html .github/workflows/add-anti-duplicate-guard.yml
          git diff --cached --quiet && exit 0
          git commit -m "[anti-duplicate] Prevent accidental double submissions"
          git push origin HEAD:main
