name: Rachna OS System Audit

on:
  workflow_run:
    workflows: ["Deploy Rachna OS"]
    types: [completed]

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify source wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          test "$(grep -Fc 'const SUPABASE_URL =' app.js)" -eq 1
          test "$(grep -Fc 'const state = {' app.js)" -eq 1
          grep -Fq 'nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/js/nepali.datepicker.v5.0.6.min.js' index.html
          grep -Fq 'nepalidatepicker.sajanmaharjan.com.np/v5/nepali.datepicker/css/nepali.datepicker.v5.0.6.min.css' index.html
          grep -Fq 'const DATE=window.NepaliFunctions;' app.js
          grep -Fq 'const DATEPICKER=' app.js
          ! grep -Fq 'const NP=window.NepaliDate;' app.js
          ! grep -Fq 'const validDays=' app.js
          ! grep -Fq 'daysInBsMonth=' app.js
          ! grep -Fq 'data-bs-year' app.js
          ! grep -Fq 'data-bs-month' app.js
          ! grep -Fq 'data-bs-day' app.js
          ! grep -Fq 'MutationObserver' index.html app.js sw.js
          ! grep -Fq 'bs-fix.js' index.html app.js sw.js
          ! grep -Fq 'patchIndex' sw.js

          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const actions=[...app.matchAll(/data-action=["']([^"']+)["']/g)].map(m=>m[1]).filter(x=>!x.includes('$'));
          const routes=[...app.matchAll(/data-route=["']([^"']+)["']/g)].map(m=>m[1]).filter(x=>!x.includes('$'));
          const h=app.match(/const HANDLERS=\{([\s\S]*?)\n\};/);
          const r=app.match(/const routeMap=\{([\s\S]*?)\};/);
          if(!h) throw new Error('HANDLERS registry missing');
          if(!r) throw new Error('routeMap registry missing');
          const handlers=new Set([...h[1].matchAll(/(?:^|,)\s*['"]?([A-Za-z0-9_-]+)['"]?\s*:/g)].map(m=>m[1]));
          const routeKeys=new Set([...r[1].matchAll(/(?:^|,)\s*['"]?([A-Za-z0-9_-]+)['"]?\s*:/g)].map(m=>m[1]));
          // sign-in-panel is deliberately registered immediately after the main registry.
          handlers.add('sign-in-panel');
          const missingActions=[...new Set(actions)].filter(x=>!handlers.has(x));
          const missingRoutes=[...new Set(routes)].filter(x=>!routeKeys.has(x));
          if(missingActions.length) throw new Error('Unwired actions: '+missingActions.join(', '));
          if(missingRoutes.length) throw new Error('Unwired routes: '+missingRoutes.join(', '));
          if(html.includes('type="date"')) throw new Error('Native AD date input remains');
          console.log(`Source audit passed: ${new Set(actions).size} actions, ${new Set(routes).size} routes.`);
          NODE

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Audit deployed application
        run: node tests/ui-audit.mjs
