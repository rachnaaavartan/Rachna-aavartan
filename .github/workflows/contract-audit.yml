name: Rachna OS Contract Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production source contracts
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          node tests/contract-audit.mjs
