name: Fix canonical BS date picker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[bs-date-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact BS date fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old=s
          s=s.replace(
            "const fmtBs=o=>o?`${o.year}-${fmt2(o.month)}-${fmt2(o.date)}`:'';",
            "const fmtBs=o=>o?`${o.year}-${fmt2(+o.month+1)}-${fmt2(o.date)}`:'';"
          )
          s=s.replace(
            "if(!b||+b.year!==p.year||+b.month!==p.month||+b.date!==p.date)throw new Error('Invalid BS date');",
            "if(!b||+b.year!==p.year||+b.month+1!==p.month||+b.date!==p.date)throw new Error('Invalid BS date');"
          )
          s=s.replace(
            "const daysInBsMonth=(y,m)=>{try{const x=new NP(y,m-1,32);return x.getMonth()===m-1?32:Math.max(0,x.getDate()-1)}catch(_){return 0}};",
            "const daysInBsMonth=(y,m)=>{try{let count=0;for(let d=1;d<=32;d++){const x=new NP(y,m-1,d);if(x.getYear()===y&&x.getMonth()===m-1&&x.getDate()===d)count=d}return count}catch(_){return 0}};"
          )
          s=s.replace(
            "const bsOfAd=ad=>{try{const p=parts(String(ad||'').slice(0,10));if(!p)throw new Error('Invalid AD date');const js=new Date(Date.UTC(p.year,p.month-1,p.date));const d=NP.fromAD?NP.fromAD(js):new NP(js);const b=d.getBS();return b?`${b.year}-${fmt2(b.month)}-${fmt2(b.date)}`:''}catch(_){return''}};",
            "const bsOfAd=ad=>{try{const p=parts(String(ad||'').slice(0,10));if(!p)throw new Error('Invalid AD date');const js=new Date(p.year,p.month-1,p.date);const d=new NP(js);const b=d.getBS();return b?`${b.year}-${fmt2(+b.month+1)}-${fmt2(b.date)}`:''}catch(_){return''}};"
          )
          if s==old: raise SystemExit('No date fixes matched')
          p.write_text(s)
          for name in ('index.html','sw.js'):
            p=Path(name); x=p.read_text().replace('20260905.22','20260905.23').replace('rachna-os-v20260905-22','rachna-os-v20260905-23'); p.write_text(x)
          PY
          node --check app.js
          node --check sw.js
          grep -Fq 'fmt2(+o.month+1)' app.js
          grep -Fq '+b.month+1!==p.month' app.js
          grep -Fq 'const daysInBsMonth=' app.js
          git rm .github/workflows/date-fix.yml
          git add app.js index.html sw.js
          git commit -m '[bs-date-fix] Fix BS month indexing and day calculation'
          git push origin HEAD:main
