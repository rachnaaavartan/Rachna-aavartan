name: Install anti-duplicate runtime guard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[anti-duplicate-runtime]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          marker="const HANDLERS={"
          guard=r'''const __rosActionLock = new WeakSet();
const __rosWriteAction = /^(save-|delete-|create-|record-|update-|remove-|assign-|convert-|submit-|approve-|reject-)/i;
const __rosOpenAction = /^(new-|edit-|add-)/i;
const __rosGuardClick = (event) => {
  const btn = event.target?.closest?.('button');
  if (!btn || btn.dataset?.noDedupe === '1') return;
  const action = btn.dataset?.action || '';
  const isModalSubmit = !!btn.closest('.modal-foot');
  if (!(isModalSubmit || __rosWriteAction.test(action) || __rosOpenAction.test(action))) return;
  if (__rosActionLock.has(btn) || btn.dataset.rosBusy === '1') {
    event.preventDefault();
    event.stopImmediatePropagation();
    return;
  }
  __rosActionLock.add(btn);
  btn.dataset.rosBusy='1';
  btn.disabled=true;
  btn.setAttribute('aria-busy','true');
  const delay = (isModalSubmit || __rosWriteAction.test(action)) ? 12000 : 900;
  window.setTimeout(() => {
    __rosActionLock.delete(btn);
    if (btn.isConnected) {
      btn.disabled=false;
      delete btn.dataset.rosBusy;
      btn.removeAttribute('aria-busy');
    }
  }, delay);
};
document.addEventListener('click', __rosGuardClick, true);

'''
          if '__rosActionLock' not in s:
              if marker not in s: raise SystemExit('HANDLERS marker missing')
              s=s.replace(marker,guard+marker,1)
          p.write_text(s)

          # Bump only app runtime cache-busting values; do not alter date-picker code.
          h=Path('index.html')
          hs=h.read_text()
          import re
          hs=re.sub(r'20260905\.\d+', '20260905.44', hs)
          h.write_text(hs)
          PY
          node --check app.js
          node --check sw.js
          grep -Fq '__rosActionLock' app.js
          grep -Fq 'app.js?v=20260905.44' index.html

      - name: Commit and remove workflow
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          rm -f .github/workflows/anti-duplicate-runtime.yml
          git add app.js index.html .github/workflows/anti-duplicate-runtime.yml
          git diff --cached --quiet && exit 0
          git commit -m "[anti-duplicate-runtime] Prevent repeated writes"
          git push origin HEAD:main
